name: Bug report
description: Something in Mewsenger does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what you saw instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Mewsenger version
      description: Settings > About, or the installer's file name.
      placeholder: "0.2.0"
    validations:
      required: true
  - type: dropdown
    id: build
    attributes:
      label: Build
      options: [Installer (NSIS), MSI, Portable, Built from source]
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Settings > General > Copy diagnostics. It holds versions and states only, never messages, paths or accounts.
      render: json
