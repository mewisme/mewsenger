name: Feature request
description: Suggest something Mewsenger should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What do you want to do
      description: The situation, not the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: How it could work, and anything you tried instead.
