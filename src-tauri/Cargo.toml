[package]
name = "messenger"
version = "0.1.14"
description = "Webview for Messenger"
authors = ["Mew"]
edition = "2021"

[lib]
name = "messenger_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = ["image-png", "tray-icon", "unstable"] }
tauri-plugin-notification = "2.8.0"
tauri-plugin-clipboard-manager = "2.5.0"
tauri-plugin-opener = "2.7.2"
url = "2"
serde = { version = "1", features = ["derive"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-positioner = "2.4.0"
