[package]
name = "mewsenger"
version = "0.2.1"
description = "Desktop client for Messenger"
authors = ["Mew"]
license = "MIT"
repository = "https://github.com/mewisme/mewsenger"
readme = "../README.md"
keywords = ["messenger", "tauri", "desktop"]
categories = ["gui"]
edition = "2021"

[lib]
name = "mewsenger_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
portable = []

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = ["image-png", "tray-icon", "unstable"] }
tauri-plugin-notification = "2.8.0"
tauri-plugin-clipboard-manager = "2.5.0"
tauri-plugin-opener = "2.7.2"
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-updater = "2.14.1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-positioner = "2.4.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Registry", "Win32_UI_Shell"] }
windows = { version = "0.62", features = ["UI_Notifications", "Data_Xml_Dom", "Foundation", "Foundation_Collections"] }
webview2-com = "0.39"
